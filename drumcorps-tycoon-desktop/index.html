<style>

.ov{position:fixed;inset:0;background:rgba(5,7,12,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.box{background:var(--pn);border:2px solid var(--a);border-radius:16px;padding:22px;max-width:520px;width:100%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;max-width:1000px;margin:auto}
.cc{border-radius:14px;padding:14px;text-align:center;border:2px solid var(--c2);background:linear-gradient(160deg,var(--c1),#0b0e17);cursor:pointer;transition:.15s}
.cc:hover{transform:scale(1.04);box-shadow:0 0 22px var(--c2)}
.cc b{display:block;margin-top:6px}.cc small{color:#d8def0;display:block;margin-top:4px}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #232c47}.stat span:first-child{color:var(--mu)}

.big{font-size:34px;font-weight:900;color:var(--a);animation:fi .8s both}@keyframes fi{from{opacity:0;transform:scale(.8)}}
label.t{display:flex;justify-content:space-between;padding:8px 0;text-align:left}
a.lnk{display:block;padding:14px;margin:10px 0;border-radius:12px;font-weight:900;text-decoration:none;color:#fff;font-size:18px}
@media(max-width:1000px){#app{grid-template-columns:1fr}#nav{flex-direction:row;flex-wrap:wrap}#side,#main{padding-top:0}#brand{position:static;text-align:center;padding:8px}#nav button{flex:1 1 30%}}
@media (prefers-color-scheme:light){body{color:var(--tx)}}

.up.can{border-color:#3dbb3d;box-shadow:0 0 10px #6be36b}.up.lock{opacity:.5}.bar{background:#c3dff3}.fl{color:#0a7a3a;text-shadow:0 0 4px #fff}.pt{background:var(--p)}.big{color:color-mix(in srgb,var(--p) 85%,#000)}

</style></head><body>
<div id="brand"><svg width="34" height="34" viewBox="0 0 40 40"><ellipse cx="20" cy="14" rx="15" ry="6" fill="#e9eefc" stroke="var(--a)" stroke-width="2"/><path d="M5 14V28Q20 38 35 28V14" fill="var(--p)" stroke="var(--a)" stroke-width="2"/><path d="M10 7 L24 21 M30 5 L16 19" stroke="var(--a)" stroke-width="2.5" stroke-linecap="round"/></svg><div><b>DRUMCORPS<em>TYCOON</em></b><i>by Alex</i></div></div>
<div id="app" hidden>
<nav id="nav"></nav>
<main id="main"><div id="tb"></div><div id="view"></div></main>
<aside id="side"><h2 style="margin:44px 0 0">🎺 UPGRADES</h2><div id="tabs" class="row" style="margin:0"></div><small id="tabnote" style="color:var(--mu)"></small><div id="bq" class="row" style="margin:0"></div><div id="ups" style="display:flex;flex-direction:column;gap:8px"></div></aside>
</div>
<div id="title"></div><div id="pick" class="ov" style="display:none"></div><div id="modal" class="ov" style="display:none"></div>
<script>
/* ===== CONFIG (easy to edit) ===== */
const CFG={firstGoal:1e3,goalGrowth:10,prestigeBase:1.10,offlineCapH:8,
 links:{youtube:"https://www.youtube.com/channel/UCXQEbVQPHn4Zig2Xe2VyCpA",patreon:"https://www.youtube.com/channel/UCXQEbVQPHn4Zig2Xe2VyCpA"},SAVE:"drumcorpsTycoon_v1"};
/* ===== DATA: corps ===== */
const CORPS=[
{id:"bd",n:"Blue Devils",c:["#0b2a6f","#e8b923","#f5d04a"],perk:["Precision","+10% Notes/sec"],sh:"star"},
{id:"bc",n:"Bluecoats",c:["#1a56c4","#ffffff","#6fb4ff"],perk:["Innovation","Upgrades cost 5% less"],sh:"shield"},
{id:"cc",n:"Carolina Crown",c:["#0a3d2e","#d4af37","#58d68d"],perk:["Brass Power","Brass upgrades +15%"],sh:"crown"},
{id:"bo",n:"Boston Crusaders",c:["#5b0f1b","#e6e6e6","#ff5a6e"],perk:["Momentum","+up to 20% Notes/sec while clicking"],sh:"cross"},
{id:"sv",n:"Santa Clara Vanguard",c:["#0b5a2c","#f0f0f0","#e0243a"],perk:["Tradition","Prestige bonus 10% stronger"],sh:"shield"},
{id:"pr",n:"Phantom Regiment",c:["#14060a","#e01b2e","#ffffff"],perk:["Intensity","Clicks give +20% Notes"],sh:"diamond"},
{id:"cv",n:"The Cavaliers",c:["#0c4a2a","#d8c07a","#5fd18a"],perk:["Efficiency","Idle production +10%"],sh:"circle"},
{id:"ma",n:"Mandarins",c:["#8a0d12","#ffd24a","#ff8a3d"],perk:["Growth","Cost scaling 1.15 → 1.14"],sh:"diamond"},
{id:"co",n:"Colts",c:["#0d3b8c","#ffffff","#7fb0ff"],perk:["Consistency","All production +8%"],sh:"circle"},
{id:"tr",n:"Troopers",c:["#0c1a3a","#c9102f","#f4f4f4"],perk:["Endurance","+1%/10min session, max +25%"],sh:"shield"},
{id:"bs",n:"Blue Stars",c:["#123a9c","#e8e8ff","#9fb6ff"],perk:["Harmony","Instrument upgrades +6%"],sh:"star"},
{id:"ms",n:"Madison Scouts",c:["#0d5a2a","#ffffff","#5fe08a"],perk:["Spirit","5% chance of ×10 click"],sh:"crown"}];
/* ===== DATA: upgrades (kind: i=instrument, b=brass, s=staff, f=facility) ===== */
const U=[["Trumpet Section","🎺","ib"],["Mellophone Section","📯","ib"],["Baritone Section","🎷","ib"],["Tuba Section","🎶","ib"],
["Battery","🥁","i"],["Front Ensemble","🎹","i"],["Color Guard","🚩","i"],["Brass Staff","👔","sb"],["Percussion Staff","🧑‍🏫","s"],
["Visual Staff","🧭","s"],["Music Staff","🎼","s"],["Corps Hall","🏠","f"],["Practice Field","🏟️","f"],["Equipment Truck","🚚","f"],
["Uniform Department","🧵","f"],["Administrative Office","🗂️","f"],["Rehearsal Facility","🏢","f"],["World-Class Headquarters","🏛️","f"]]
.map((u,i)=>({id:i,n:u[0],ic:u[1],k:u[2],base:4*Math.pow(6.8,i),rps:0.2*Math.pow(5.4,i)}));
/* click upgrades (Notes per click) */
const CU=[["Valve Oil","🛢️"],["Better Mouthpiece","🎤"],["Fresh Sticks","🥢"],["Metronome","⏱️"],["Sectionals","👥"],["Sheet Music Binder","📒"],["Private Lessons","🎓"],["Clinician Visit","🌟"],["Show Concept","🎭"],["Gold Medal Focus","🥇"]].map((u,i)=>({id:18+i,n:u[0],ic:u[1],k:"c",base:5*Math.pow(9,i),rps:0,add:Math.pow(4.2,i)}));
U.push(...CU);
const clickAdd=()=>U.reduce((a,u)=>a+(u.add||0)*lvl(u.id)*(1+Math.floor(lvl(u.id)/25)*.25),0);
/* ===== util ===== */
const SUF=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd"];
function fmt(n,d=2){if(!isFinite(n))return"∞";if(n<1000)return n<10&&n%1?n.toFixed(d):Math.floor(n).toString();
 if(S&&S.cfg.sci||n>=1e45)return n.toExponential(2).replace("e+","e");const e=Math.floor(Math.log10(n)/3);return(n/Math.pow(10,e*3)).toFixed(d)+SUF[e]}
const $=(q)=>document.querySelector(q),el=(h)=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
function dur(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:m?`${m}m ${s%60}s`:`${s}s`}
/* ===== state & save ===== */
const fresh=()=>({corp:null,notes:0,bought:{},runClicks:0,runStart:Date.now(),
 life:0,clicks:0,instBought:0,upBought:0,trophies:0,shows:0,run:1,played:0,maxRps:0,mostId:{},
 cfg:{sound:true,floats:true,fx:1,sci:false,offline:true},last:Date.now()});
let S=fresh(),view="home",lastClick=0;
function save(){S.last=Date.now();try{localStorage.setItem(CFG.SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(CFG.SAVE);if(r)S=Object.assign(fresh(),JSON.parse(r),{});S.cfg=Object.assign(fresh().cfg,S.cfg)}catch(e){}}
/* ===== audio ===== */
let AC;function snd(f,d=.08,t="square",v=.04){if(!S.cfg.sound)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
/* ===== economy ===== */
const C=()=>CORPS.find(c=>c.id===S.corp);
const lvl=i=>S.bought[i]||0,totalLv=()=>U.reduce((a,u)=>u.k==="c"?a:a+lvl(u.id),0);
const pMult=()=>Math.pow(CFG.prestigeBase+(S.corp==="sv"?.01:0),S.trophies); // SCV: +10% of the 10% bonus
const growth=()=>S.corp==="ma"?1.14:1.15;
const costOf=i=>{const u=U[i];return Math.ceil(u.base*Math.pow(growth(),lvl(i))*(S.corp==="bc"?.95:1))};
function upRps(u){let m=1;const k=u.k;if(S.corp==="cc"&&k.includes("b"))m*=1.15;if(S.corp==="cv")m*=1.1;if(S.corp==="bs"&&k.includes("i"))m*=1.06;return u.rps*lvl(u.id)*m*(1+Math.floor(lvl(u.id)/25)*.25)}
function rps(){let r=0;U.forEach(u=>r+=upRps(u));let m=pMult();if(S.corp==="bd")m*=1.1;if(S.corp==="co")m*=1.08;
 if(S.corp==="bo"&&Date.now()-lastClick<3000)m*=1.2;if(S.corp==="tr")m*=1+Math.min(.25,Math.floor((Date.now()-S.runStart)/6e5)*.01);return r*m}
function clickVal(){let v=(1+clickAdd())*pMult();if(S.corp==="pr")v*=1.2;return Math.max(1,v)}
const goal=()=>CFG.firstGoal*Math.pow(CFG.goalGrowth,S.run-1);
function add(n){S.notes+=n;S.life+=n}
/* ===== HQ drawing ===== */
const STAGES=[[0,"Rehearsal Shed"],[5,"Fresh Paint"],[10,"Corps Garage"],[15,"Corps House"],[25,"Rehearsal Hall"],[50,"Training Complex"],[75,"Expanded Complex"],[100,"Corps Campus"],[150,"Regional Campus"],[250,"World-Class Facility"],[350,"Elite Facility"],[500,"Legendary Headquarters"]];
let BQ=1;
function plan(i){const l=lvl(i),cs=k=>Math.ceil(U[i].base*Math.pow(growth(),l+k)*(1+(l+k)*(l+k)/2500)*(S.corp==="bc"?.95:1));let tot=0,n=0;
 if(BQ==="max"){while(n<500&&tot+cs(n)<=S.notes){tot+=cs(n);n++}return n?{n,cost:tot}:{n:0,cost:cs(0)}}
 for(;n<BQ;n++)tot+=cs(n);return{n:tot<=S.notes?BQ:0,cost:tot}}
function initBQ(){$("#bq").innerHTML=[1,10,100,"max"].map(q=>`<button data-q="${q}" style="padding:4px 10px">${q==="max"?"MAX":"×"+q}</button>`).join("");
 $("#bq").querySelectorAll("button").forEach(b=>b.onclick=()=>{BQ=b.dataset.q==="max"?"max":+b.dataset.q;$("#bq").querySelectorAll("button").forEach(x=>x.style.borderColor=x===b?"var(--a)":"");upd()});$("#bq button").style.borderColor="var(--a)"}
function hqSVG(){const c=C(),L=totalLv(),[p,s,a]=c.c;let g="";const R=(x,y,w,h,f,o="")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${o}/>`;
 const stage=STAGES.filter(q=>L>=q[0]).pop()[1],bw=70+Math.min(L,150)*.45,x=200-bw/2,h2=L>=50?36:0,top=200-44-h2,flat=L>=100,grand=L>=250,lit="#ffe9a0";
 g+=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb3f5"/><stop offset="1" stop-color="#d8f3ff"/></linearGradient></defs>${R(0,0,400,200,"url(#sk)")}<circle cx="352" cy="38" r="26" fill="#fff6b0" opacity=".5"/><circle cx="352" cy="38" r="15" fill="#ffd84a"/><ellipse cx="80" cy="210" rx="170" ry="48" fill="#8be86a"/><ellipse cx="330" cy="214" rx="150" ry="40" fill="#74d856"/>`;
 [[30,20],[80,50],[140,24],[250,16],[300,60],[60,90],[200,40],[380,90]].forEach((q,i)=>g+=`<ellipse cx="${q[0]}" cy="${q[1]}" rx="${16+i%3*6}" ry="7" fill="#fff" opacity=".85"><animate attributeName="cx" values="${q[0]};${q[0]+16};${q[0]}" dur="${14+i*3}s" repeatCount="indefinite"/></ellipse>`);

 const sync=()=>{t.querySelectorAll("button").forEach(b=>{const on=b.dataset.t===UT;b.style.borderColor=on?"var(--a)":"";b.style.background=on?"var(--p)":""});$("#tabnote").textContent=UT==="hall"?"Boosts Notes/sec · each level changes how your hall looks":"Boosts Notes per click"};
 t.querySelectorAll("button").forEach(b=>b.onclick=()=>{UT=b.dataset.t;sync();upd()});sync()}
let titleOn=true;
function mkBubbles(){for(let i=0;i<14;i++){const b=document.createElement("div");b.className="bub";const z=30+Math.random()*90;b.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;bottom:-130px;animation-duration:${14+Math.random()*18}s;animation-delay:-${Math.random()*20}s`;document.body.appendChild(b)}}
function showTitle(){titleOn=true;const t=$("#title"),has=!!S.corp;t.style.display="flex";
 t.innerHTML=`<svg width="170" height="130" viewBox="0 0 170 130"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#bfe6ff"/><stop offset="1" stop-color="#4aa6ee"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#f1c24a"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs><path d="M30 18l50 42M104 12L76 56" stroke="#f1c24a" stroke-width="5" stroke-linecap="round"/><path d="M30 55v42q0 14 40 14t40-14V55z" fill="url(#gd)" stroke="#1d6fc9" stroke-width="2"/><ellipse cx="70" cy="55" rx="40" ry="13" fill="#fff" stroke="#1d6fc9" stroke-width="2"/><path d="M36 67l10 38M54 70l8 40M70 72v40M86 70l-8 40M104 67l-10 38" stroke="#e0243a" stroke-width="3" opacity=".7"/><path d="M114 84h30l22-16v52l-22-16h-30z" fill="url(#gb)" stroke="#a87b10" stroke-width="2"/><ellipse cx="166" cy="94" rx="3" ry="26" fill="#fff6" /></svg>
 <div class="logo" style="margin-top:6px;letter-spacing:.16em">DRUMCORPS TYCOON</div><p><i>by Alex</i></p>
 <p style="font-size:17px;margin:12px 4px 18px"><b>Welcome to the show!</b> Build your drum &amp; bugle corps from a humble rehearsal shed into a world-class headquarters, and chase the championship.</p>
 <button class="tbtn btn2" id="st">▶ START</button><button class="tbtn" id="qt">✖ QUIT</button>
 <small style="color:#08335f;margin-top:10px">${has?`Saved game found: ${C().n} · ${S.trophies} 🏆 · last saved ${new Date(S.last).toLocaleString()}`:"Your progress saves automatically on this device."}</small>`;
 $("#st").onclick=()=>{snd(660,.1);enterGame()};$("#qt").onclick=quitGame}
function quitGame(){save();if(window.desktop&&window.desktop.quit)return window.desktop.quit();window.close();setTimeout(()=>{modal(`<h2>Thanks for playing!</h2><p>Your game is saved. You can close this window now.</p><div class="row"><button class="btn2" id="ok">OK</button></div>`);$("#ok").onclick=closeModal},200)}
const saveCode=()=>btoa(unescape(encodeURIComponent(JSON.stringify(S))));

 $("#cl2").onclick=closeModal;$("#dl").onclick=()=>{const a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(saveCode());a.download="drumcorps-tycoon-save.txt";a.click()};
 $("#im").onclick=()=>{try{S=Object.assign(fresh(),JSON.parse(decodeURIComponent(escape(atob($("#ic").value.trim())))));save();location.reload()}catch(e){$("#ic").value="Invalid save code"}}}

 if(view==="home"){const c=C();v.innerHTML=`<div id="corpsname">${emblem(c,34)} The ${c.n.replace("The ","")}</div>

 else if(view==="compete"){const g=goal(),ok=S.notes>=g,c=C();v.innerHTML=`<div class="card" style="text-align:center"><h2>READY TO COMPETE?</h2>

 <p>Current Notes: <b>${fmt(S.notes)}</b></p><p>🏆 You will receive <b>1 Trophy</b><br>Multiplier: <b>${pMult().toFixed(2)}× → ${(pMult()*(CFG.prestigeBase+(S.corp==="sv"?.01:0))).toFixed(2)}×</b></p>
 <div style="text-align:left;max-width:360px;margin:auto"><b>Will reset:</b> Notes, instruments, staff, buildings, current upgrades<br><b>Will remain:</b> Trophies, lifetime Notes, shows played, prestige multiplier, statistics</div>
 <div class="row"><button class="btn2" ${ok?"":"disabled"} id="go">COMPETE</button></div></div>`;$("#go").onclick=competeSeq}
 else if(view==="stats"){const most=Object.entries(S.mostId).sort((a,b)=>b[1]-a[1])[0];const rows=[["Current Corps",C().n],["Notes Played",fmt(S.notes)],["Notes Per Second",fmt(rps())],["Total Lifetime Notes",fmt(S.life)],["Manual Clicks",S.clicks.toLocaleString()],["Instruments Bought",S.instBought.toLocaleString()],["Shows Played",S.shows],["Championships",S.shows],["Trophies",S.trophies],["Prestige Multiplier",pMult().toFixed(2)+"×"],["Highest Notes Per Second",fmt(S.maxRps)],["Current Run","#"+S.run],["Time Played",dur(S.played)],["Total Upgrades Purchased",S.upBought.toLocaleString()],["Most Purchased",most?U[most[0]].n:"—"],["Next Show Goal",fmt(goal())]];
  v.innerHTML=`<div class="card"><h2>CORPS STATISTICS</h2>${rows.map(r=>`<div class="stat"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}<div style="margin-top:10px">${"🏆".repeat(Math.min(S.trophies,40))}</div></div>`}
 else if(view==="love"){v.innerHTML=`<div class="card" style="text-align:center"><h2>SEND ME SOME LOVE!</h2><p>Drumcorps Tycoon is a fan-made game created by <b>Alex</b>. If you're enjoying it, the best support is a follow and a share. Thank you! ❤️</p>
 <a class="lnk" style="background:#c4302b" target="_blank" rel="noopener" href="${CFG.links.youtube}">▶ YouTube</a><a class="lnk" style="background:#f96854" target="_blank" rel="noopener" href="${CFG.links.patreon}">♥ Patreon</a>
 <small style="color:var(--mu)">Fan project. Corps logos are © their respective organizations and are used with permission: "+CORPS.map(c=>c.n).join(", ")+".</small></div>`}
 upd()}
function upd(){const tbx=$("#tb");if(tbx)tbx.innerHTML=[["🎵","Notes",fmt(S.notes)],["⚡","Notes/sec",fmt(rps())],["👆","Per click",fmt(clickVal())],["✖️","Multiplier",pMult().toFixed(2)+"×"],["🏆","Trophies",S.trophies],["🏁","Run","#"+S.run]].map(x=>`<div class="chip"><small>${x[0]} ${x[1]}</small><b>${x[2]}</b></div>`).join("");const n=$("#count");if(n){n.textContent=fmt(S.notes)+" NOTES";{const x=STAGES.find(q=>q[0]>totalLv());$("#nxt").textContent=x?`Next hall upgrade: ${x[1]} at ${x[0]} total levels (${totalLv()})`:"Headquarters fully upgraded!"}$("#rps").textContent="+"+fmt(rps())+" Notes/sec";
  $("#clickinfo").textContent="+"+fmt(clickVal())+" per click · Multiplier "+pMult().toFixed(2)+"×";const g=goal();
  $("#gbar").style.width=Math.min(100,S.notes/g*100)+"%";$("#gtxt").textContent=`Show goal: ${fmt(S.notes)} / ${fmt(g)} (Run #${S.run})`;
  $("#compete").style.display=S.notes>=g?"block":"none"}
 U.forEach(u=>{const e=$("#u"+u.id);if(!e)return;const P=plan(u.id),cost=P.cost,can=P.n>0,vis=u.id===0||u.id===18||S.life>=u.base*.3||lvl(u.id)>0;e.style.display=(u.k==="c")===(UT==="corps")?"":"none";
  e.classList.toggle("lock",!vis);e.classList.toggle("can",can&&vis);e.querySelector(".nm").textContent=vis?u.n:"???";
  e.querySelector(".lv").textContent=vis?`Level ${lvl(u.id)} · +${u.k==="c"?fmt(u.add*lvl(u.id)*(1+Math.floor(lvl(u.id)/25)*.25)*pMult())+"/click":fmt(upRps(u)*pMult())+"/s"}`:"Locked";e.querySelector(".co").textContent=vis?"Cost: "+fmt(cost)+(P.n>1||BQ!==1?" (×"+(P.n||BQ)+")":""):"";
  e.querySelector("button").disabled=!can||!vis});
 const cb=$("#cn");if(cb)cb.style.display=S.notes>=goal()?"inline":"none"}
function buildUps(){$("#ups").innerHTML="";U.forEach(u=>{const e=el(`<div class="up" id="u${u.id}" title="${u.k.includes("b")?"Brass":"Corps"} upgrade: +25% output every 25 levels"><div class="ic">${u.ic}</div><div><b class="nm"></b><small class="lv"></small><small class="co"></small></div><button>BUY</button></div>`);
 e.querySelector("button").onclick=()=>buy(u.id);$("#ups").appendChild(e)})}
function buy(i){const P=plan(i);if(!P.n)return;S.notes-=P.cost;S.bought[i]=lvl(i)+P.n;S.upBought+=P.n;if(i<7)S.instBought+=P.n;S.mostId[i]=(S.mostId[i]||0)+P.n;snd(520+i*20,.1,"triangle");
 if(view==="home")$("#view").querySelector("#hq").outerHTML=hqSVG();upd();save()}
function nav(){const B=[["home","🏠","Home","Home"],["upg","🎺","Upgrades","Upgrades"],["compete","🏆","Compete","Compete"],["stats","📊","Stats","Stats"],["switch","🔄","Switch Corps!","Switch"],["love","❤️","Send Me Some Love!","Love"],["save","💾","Save / Export","Save"],["set","⚙️","Settings","Settings"],["menu","🚪","Main Menu","Menu"]];
 $("#nav").innerHTML=B.map(b=>`<button data-v="${b[0]}" title="${b[2]}"><span class="ic">${b[1]}</span><small>${b[3].toUpperCase()}</small></button>`).join("");
 document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{const v=b.dataset.v;snd(500,.05);if(v==="switch")return switchWarn();if(v==="set")return settings();if(v==="save")return saveMenu();if(v==="menu"){save();return showTitle()}if(v==="upg"){setView("home");$("#side").scrollIntoView({behavior:"smooth"});return}setView(v)})}
/* ===== actions ===== */
function doClick(e){let v=clickVal(),bonus="";if(S.corp==="ms"&&Math.random()<.05){v*=10;bonus=" SPIRIT!"}
 add(v);S.clicks++;lastClick=Date.now();snd(660+Math.random()*120,.06);
 const x=e.clientX||innerWidth/2,y=e.clientY||innerHeight/2;
 if(S.cfg.floats){const f=el(`<div class="fl" style="left:${x-10}px;top:${y-20}px">+${fmt(v)}${bonus}</div>`);document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
 for(let i=0;i<Math.round(5*S.cfg.fx);i++){const p=el(`<div class="pt" style="left:${x}px;top:${y}px;--dx:${(Math.random()-.5)*120}px;--dy:${-Math.random()*90}px"></div>`);document.body.appendChild(p);setTimeout(()=>p.remove(),600)}
 upd()}
function modal(h){const m=$("#modal");m.innerHTML=`<div class="box">${h}</div>`;m.style.display="flex"}
const closeModal=()=>$("#modal").style.display="none";
function resetRun(){S.notes=0;S.bought={};S.runClicks=0;S.runStart=Date.now()}
function switchWarn(){modal(`<h2 style="color:#ff6b6b">⚠ WARNING</h2><p><b>Switching corps will reset your current run.</b></p><div style="text-align:left;max-width:340px;margin:auto">You will lose: current Notes, upgrades, instruments, headquarters progress.<br>Your trophies and prestige progress will remain.</div><p><b>Are you sure you want to switch corps?</b></p>
 <div class="row"><button class="btn2" id="rs">RESET &amp; SWITCH</button><button id="gb">GO BACK</button></div>`);
 $("#gb").onclick=closeModal;$("#rs").onclick=()=>{closeModal();resetRun();S.corp=null;save();showPick()}}
function showPick(){const p=$("#pick");p.style.display="flex";p.style.flexDirection="column";
 p.innerHTML=`<div class="logo" style="margin-top:30px;letter-spacing:.16em">DRUMCORPS TYCOON</div><p style="color:var(--mu);margin:2px 0 6px">by Alex</p><h1 style="letter-spacing:.14em;margin:6px 0 16px">CHOOSE YOUR CORPS</h1><div class="grid">${CORPS.map(c=>`<div class="cc" data-id="${c.id}" style="--c1:${c.c[0]};--c2:${c.c[1]}">${emblem(c,70)}<b>${c.n}</b><small><b style="color:${c.c[2]}">${c.perk[0]}</b><br>${c.perk[1]}</small><small style="font-size:10px;opacity:.7">Logo © ${c.n}, used with permission</small></div>`).join("")}</div>`;
 p.querySelectorAll(".cc").forEach(d=>d.onclick=()=>{S.corp=d.dataset.id;theme();p.style.display="none";$("#app").hidden=false;snd(440,.2);save();setView("home")})}
function competeSeq(){const c=C(),o=$("#modal");o.style.display="flex";
 const steps=["DRUM CORPS INTERNATIONAL","WORLD CLASS FINALS","THE "+c.n.replace("The ","").toUpperCase(),"CHAMPIONS"];let i=0;
 const show=()=>{if(i<steps.length){o.innerHTML=`<div class="box" style="border-color:transparent;background:none"><div class="big">${steps[i]}</div></div>`;snd(300+i*120,.4,"sawtooth");i++;setTimeout(show,900)}else done()};show();
 function done(){const g=goal(),before=pMult();S.trophies++;S.shows++;resetRun();S.run++;snd(880,.5,"triangle");setTimeout(()=>snd(1100,.6,"triangle"),200);save();
  o.innerHTML=`<div class="box"><div style="font-size:80px">🏆</div><div class="big">WORLD CLASS CHAMPION</div><p>Trophies: <b>${S.trophies}</b><br>Multiplier: <b>${before.toFixed(2)}× → ${pMult().toFixed(2)}×</b><br>Next show goal: <b>${fmt(goal())}</b></p><div class="row"><button class="btn2" id="ct">CONTINUE</button></div></div>`;
  $("#ct").onclick=()=>{closeModal();setView("home")}}}
function settings(){const t=(k,l)=>`<label class="t"><span>${l}</span><input type="checkbox" data-k="${k}" ${S.cfg[k]?"checked":""}></label>`;
 modal(`<h2>⚙️ SETTINGS</h2>${t("sound","Sound")}${t("floats","Floating click numbers")}${t("offline","Offline progress")}${t("sci","Scientific number format")}
 <label class="t"><span>Animation intensity</span><input type="range" min="0" max="2" step="1" id="fx" value="${S.cfg.fx}"></label>
 <div class="row"><button id="rst" style="border-color:#ff6b6b">RESET SAVE</button><button class="btn2" id="cl">CLOSE</button></div>`);
 document.querySelectorAll("#modal input[type=checkbox]").forEach(i=>i.onchange=()=>{S.cfg[i.dataset.k]=i.checked;save();upd()});
 $("#fx").oninput=e=>{S.cfg.fx=+e.target.value;save()};$("#cl").onclick=closeModal;
 $("#rst").onclick=()=>{modal(`<h2 style="color:#ff6b6b">DELETE EVERYTHING?</h2><p>This permanently erases all progress, trophies and stats.</p><div class="row"><button id="y" style="border-color:#ff6b6b">DELETE SAVE</button><button class="btn2" id="n">CANCEL</button></div>`);
  $("#n").onclick=closeModal;$("#y").onclick=()=>{localStorage.removeItem(CFG.SAVE);S=fresh();closeModal();$("#app").hidden=true;showPick()}}}
/* ===== loop ===== */
let prev=Date.now(),sv=0;
setInterval(()=>{const n=Date.now(),dt=(n-prev)/1000;prev=n;if(!S.corp||titleOn)return;const r=rps();add(r*dt);S.played+=dt;S.maxRps=Math.max(S.maxRps,r);upd();if(view==="stats"&&(sv++%5===0))render();
 if((sv%100)===0)save()},100);
addEventListener("beforeunload",save);document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
/* ===== boot ===== */
load();nav();buildUps();initBQ();initTabs();
function enterGame(){titleOn=false;$("#title").style.display="none";if(S.corp){theme();$("#app").hidden=false;setView("home");
 const away=(Date.now()-S.last)/1000;if(S.cfg.offline&&away>60){const eff=Math.min(away,CFG.offlineCapH*3600),gain=rps()*eff;
  if(gain>0){add(gain);modal(`<h2>WELCOME BACK!</h2><p>You were away for:</p><div class="big">${dur(away)}</div><p>Your corps generated:</p><div class="big">+${fmt(gain)} Notes</div><small style="color:var(--mu)">Offline progress is capped at ${CFG.offlineCapH} hours.</small><div class="row"><button class="btn2" id="ok">CONTINUE</button></div>`);$("#ok").onclick=closeModal}}}
else showPick();}
mkBubbles();showTitle();
</script></body></html>
